<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Requirement builder — find any IT consultant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: { extend: {
      colors: { paper:'#FBFBF9', ink:'#141B22', sea:'#2B4C6F', amber:'#C97B2E', slate:'#8A96A3' },
      fontFamily: { grotesk:['"Space Grotesk"','system-ui','sans-serif'], serif:['"Newsreader"','Georgia','serif'] }
    }}
  };
</script>
<style>
  html,body,#root{height:100%}
  body{background:#FBFBF9;color:#141B22}
  /* document */
  .doc{ font-family:"Newsreader",Georgia,serif; font-size:19px; line-height:1.85; color:#141B22; outline:none; }
  .doc:empty:before{ content:attr(data-ph); color:#8A96A3; font-style:italic; }
  .doc .ins{ background:rgba(43,76,111,.18); border-radius:3px; box-shadow:0 0 0 2px rgba(43,76,111,.18); transition:background 1.3s ease, box-shadow 1.3s ease; }
  .doc .ins.settle{ background:transparent; box-shadow:0 0 0 2px rgba(43,76,111,0); }
  @media (prefers-reduced-motion: reduce){ .doc .ins{ transition:none } }
  /* level meter */
  .meter{ display:block; width:100%; height:52px; background:#FBFBF9; }
  /* focus visibility */
  :focus-visible{ outline:2px solid #2B4C6F; outline-offset:2px; }
  ::selection{ background:rgba(43,76,111,.20) }
  /* thin scrollbars */
  .scroll{ scrollbar-width:thin; scrollbar-color:#c9cdd3 transparent }
  .scroll::-webkit-scrollbar{ width:8px }
  .scroll::-webkit-scrollbar-thumb{ background:#d6d9dd; border-radius:8px }
  .recdot{ width:9px;height:9px;border-radius:50%;background:#C97B2E;display:inline-block }
  @media (prefers-reduced-motion: no-preference){ .recdot{ animation:blink 1.4s ease-in-out infinite } }
  @keyframes blink{ 0%,100%{opacity:1} 50%{opacity:.35} }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
<script type="text/babel" data-presets="react">
const { useState, useRef, useEffect, useCallback } = React;

/* ─────────────────────────── data ─────────────────────────── */
const CITIES = ['Oslo','Bergen','Trondheim','Stavanger','Tromsø','Drammen','Kristiansand','Fredrikstad','Sandnes','Bodø','Ålesund','Sandvika','Lysaker','Fornebu','Skøyen'];

// blocking order: role, must-have, start date, location first
const CHECKS = [
  { key:'role',         label:'Role',                     q:'What role are you hiring for?' },
  { key:'mustHave',     label:'Must have',                q:'What are the non-negotiable skills?' },
  { key:'startDate',    label:'Start date',               q:'When should they start?' },
  { key:'location',     label:'Work location',            q:'Which city or office?' },
  { key:'mode',         label:'Onsite / hybrid / remote', q:'Onsite, hybrid or remote?' },
  { key:'workload',     label:'Workload',                 q:'What workload — e.g. 80%, 100%?' },
  { key:'duration',     label:'Duration',                 q:'How long is the engagement?' },
  { key:'goodToHave',   label:'Good to have',             q:'Any nice-to-have skills?' },
  { key:'projectDesc',  label:'Project description',      q:'What is the project about?' },
  { key:'applyBefore',  label:'Apply before',             q:'What is the application deadline?' },
  { key:'process',      label:'Process forward',          q:'What are the next steps?' },
  { key:'sellingPoint', label:'Selling point',            q:'Why should someone want this?' },
];

const COMPOSE = {
  role:         a => `Vi søker en ${a}.`,
  projectDesc:  a => `Prosjektet handler om ${a}.`,
  mustHave:     a => `Kandidaten må ha ${a}.`,
  goodToHave:   a => `Det er en fordel med ${a}.`,
  location:     a => `Arbeidssted er ${a}.`,
  mode:         a => `Arbeidsform er ${a}.`,
  workload:     a => `Stillingen er på ${a}.`,
  startDate:    a => `Ønsket oppstart er ${a}.`,
  duration:     a => `Oppdragets varighet er ${a}.`,
  applyBefore:  a => `Søknadsfrist er ${a}.`,
  process:      a => `Videre prosess: ${a}.`,
  sellingPoint: a => `Hvorfor jobbe her: ${a}.`,
};

const SEED =
  "Vi ser etter en senior backend-utvikler til et av våre større kundeprosjekter i finanssektoren. " +
  "Prosjektet handler om å modernisere en aldrende monolitt til en skybasert, hendelsesdrevet plattform " +
  "som håndterer betalinger i sanntid. Teamet består av åtte utviklere fordelt på to tverrfaglige team, og " +
  "jobber tett med arkitekter og produktledelse. Kandidaten må ha solid erfaring med Java og Spring Boot, " +
  "Kubernetes og CI/CD, samt god forståelse for distribuerte systemer og meldingskøer som Kafka. Vi legger " +
  "vekt på ryddig kode, tester og faglig trygghet. Arbeidsstedet er i Oslo sentrum, og vi praktiserer en " +
  "hybrid arbeidsform der teamet møtes på kontoret to til tre dager i uken. Konsulenten vil inngå i et " +
  "etablert team og bidra fra dag én, med god onboarding og en fadder de første ukene. Vi ønsker en som tar " +
  "initiativ, kommuniserer godt på norsk og engelsk, og trives med ansvar.";

// stubbed "transcription" fragments the speech button inserts on stop
const STUB_LINES = [
  "Ønsket oppstart er i midten av mars, med mulighet for forlengelse.",
  "Stillingen er på 100 %, og oppdraget varer initielt i tolv måneder.",
  "Søknadsfrist er 28. februar, og aktuelle kandidater vurderes fortløpende.",
  "Videre prosess er en kort teknisk samtale etterfulgt av et kundemøte.",
];

/* ─────────────────────────── heuristics ─────────────────────────── */
const clean = s => (s || '').replace(/\s+/g,' ').trim();
function after(text, re, len=60){
  const m = text.match(re);
  if(!m) return null;
  const i = m.index + m[0].length;
  const tail = text.slice(i, i+len).split(/[.\n;]/)[0];
  return clean(tail).replace(/^[,:\-–\s]+/,'') || null;
}
const cityRe = new RegExp('\\b(' + CITIES.join('|') + ')\\b', 'i');
const dateRe = /(\b\d{1,2}\.\s?(?:jan|feb|mar|apr|mai|jun|jul|aug|sep|okt|nov|des)[a-zæøå]*|\b(?:jan|feb|mar|apr|mai|jun|jul|aug|sep|okt|nov|des)[a-zæøå]*\s+\d{4}|\bq[1-4]\b|\b\d{1,2}[.\/]\d{1,2}(?:[.\/]\d{2,4})?)/i;

function detect(text){
  const low = text.toLowerCase();
  const words = (text.trim().match(/\S+/g) || []).length;
  const r = {};
  const set = (k,cov,val) => { r[k] = { covered: !!cov, value: cov ? (val||'Detected') : null }; };

  // role
  const roleM = text.match(/((?:senior|junior|lead|principal)\s+)?((?:back-?end|front-?end|full-?stack|fullstack|cloud|data|sikkerhets?)[- ]?)?(utvikler|developer|ingeniør|engineer|arkitekt|architect|konsulent|consultant|designer|tester|devops|prosjektleder|scrum master|data scientist|analytiker)\w*/i);
  set('role', roleM, roleM ? clean(roleM[0]) : null);

  // project description
  const proj = /(prosjekt|system|plattform|løsning|applikasjon|migrer|moderniser|utvikle|bygge|integrasjon)/i.test(low) && words > 30;
  set('projectDesc', proj, 'Beskrevet');

  // must have
  const mustRe = /(må ha|må\-krav|must have|krav(?:et|ene)?|obligatorisk|påkrevd|forutsetter)/i;
  set('mustHave', mustRe.test(low), after(text, mustRe) || 'Spesifisert');

  // good to have
  const goodRe = /(bør ha|good to have|nice to have|ønskelig|en fordel|fordel om|pluss om|gjerne erfaring)/i;
  set('goodToHave', goodRe.test(low), after(text, goodRe) || 'Spesifisert');

  // location
  const cityM = text.match(cityRe);
  set('location', cityM, cityM ? cityM[1] : null);

  // mode
  let mode = null;
  if(/remote-?first/i.test(low)) mode = 'Remote-first';
  else if(/hybrid/i.test(low)) mode = 'Hybrid';
  else if(/(remote|fjernarbeid|hjemmekontor)/i.test(low)) mode = 'Remote';
  else if(/(on-?site|på kontoret|stedlig|fullt på kontor)/i.test(low)) mode = 'Onsite';
  set('mode', mode, mode);

  // workload
  let load = null;
  const pct = text.match(/(\d{1,3})\s?%/);
  if(pct) load = pct[1] + '%';
  else if(/(heltid|fulltid|full-time)/i.test(low)) load = 'Heltid';
  else if(/(deltid|part-time)/i.test(low)) load = 'Deltid';
  set('workload', load, load);

  // start date
  const startCue = /(oppstart|tiltredelse|starter|ønsket start|snarest|umiddelbart|så snart)/i;
  let start = null;
  if(/(snarest|umiddelbart|så snart)/i.test(low)) start = 'Snarest';
  else if(startCue.test(low) && dateRe.test(text)) start = (text.match(dateRe) || [])[0];
  set('startDate', start, start ? clean(start) : null);

  // apply before
  const applyRe = /(søknadsfrist|søk innen|frist(?:en)?|apply before|deadline|svar(?:er)? innen)/i;
  const applyVal = applyRe.test(low) ? (after(text, applyRe) || 'Satt') : null;
  set('applyBefore', applyVal, applyVal);

  // duration
  let dur = null;
  const durM = text.match(/(\d+)\s?(mnd|måneder|month|months|år|years?)/i);
  if(durM) dur = clean(durM[0]);
  else if(/(varighet|løpetid|initielt|forlengelse|til og med|langsiktig)/i.test(low)) dur = 'Angitt';
  set('duration', dur, dur);

  // process forward
  const procRe = /(intervju|interview|prosess|neste steg|utvelgelse|case-?runde|referanser|presenteres|kundemøte|teknisk samtale)/i;
  set('process', procRe.test(low), 'Beskrevet');

  // selling point
  const sellRe = /(hvorfor jobbe|vi tilbyr|du får|we offer|bli med|spennende|fagmiljø|attraktiv|godt arbeidsmiljø|utvikle deg)/i;
  set('sellingPoint', sellRe.test(low), 'Angitt');

  return r;
}

/* ─────────────────────────── small UI atoms ─────────────────────────── */
const Mic = ({size=20}) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
    <rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0"/><line x1="12" y1="17" x2="12" y2="21"/><line x1="8" y1="21" x2="16" y2="21"/>
  </svg>
);
const Check = ({size=15}) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
);
const fmt = s => `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;

/* ─────────────────────────── app ─────────────────────────── */
function App(){
  const docRef = useRef(null);
  const debRef = useRef(null);
  const [results, setResults] = useState({});
  const [showAll, setShowAll] = useState(false);
  const stubIdx = useRef(0);

  // run detection from the live document text
  const runDetect = useCallback(() => {
    const el = docRef.current;
    if(!el) return;
    setResults(detect(el.innerText || ''));
  }, []);
  const scheduleDetect = useCallback(() => {
    clearTimeout(debRef.current);
    debRef.current = setTimeout(runDetect, 600);
  }, [runDetect]);

  // seed on load + surface gaps immediately
  useEffect(() => {
    if(docRef.current){ docRef.current.innerText = SEED; runDetect(); }
    return () => clearTimeout(debRef.current);
  }, [runDetect]);

  // insert a well-formed sentence at the end of the document, highlighted
  const insertSentence = useCallback((sentence) => {
    const el = docRef.current;
    if(!el) return;
    const lead = (el.innerText.trim().length ? ' ' : '');
    const span = document.createElement('span');
    span.className = 'ins';
    span.textContent = lead + sentence;
    el.appendChild(span);
    // eslint-disable-next-line no-unused-expressions
    span.offsetWidth; // force reflow so the transition runs
    requestAnimationFrame(() => span.classList.add('settle'));
    try { span.scrollIntoView({ block:'nearest', behavior:'smooth' }); } catch(e){ span.scrollIntoView(); }
    setTimeout(() => { if(span.parentNode){ const t=document.createTextNode(span.textContent); span.parentNode.replaceChild(t, span); } }, 1500);
    runDetect();
  }, [runDetect]);

  const answerGap = useCallback((key, raw) => {
    const a = clean(raw).replace(/[.]\s*$/,'');
    if(!a) return;
    const fn = COMPOSE[key];
    insertSentence(fn ? fn(a) : a);
  }, [insertSentence]);

  const insertStub = useCallback(() => {
    const line = STUB_LINES[stubIdx.current % STUB_LINES.length];
    stubIdx.current += 1;
    insertSentence(line);
  }, [insertSentence]);

  // derived
  const merged = CHECKS.map(c => ({ ...c, ...(results[c.key] || { covered:false, value:null }) }));
  const gaps = merged.filter(c => !c.covered);
  const covered = merged.filter(c => c.covered);
  const coveredCount = covered.length;
  const visibleGaps = showAll ? gaps : gaps.slice(0, 5);
  const hiddenCount = gaps.length - visibleGaps.length;

  return (
    <div className="min-h-screen lg:h-screen flex flex-col bg-paper">
      {/* HERO */}
      <header className="shrink-0 border-b border-black/10 px-6 sm:px-10 py-6 flex flex-col sm:flex-row sm:items-end sm:justify-between gap-5">
        <div>
          <div className="font-grotesk text-[12px] tracking-[0.18em] uppercase text-slate mb-2">Requirement builder</div>
          <h1 className="font-grotesk text-2xl sm:text-[30px] font-600 text-ink leading-tight">Find any IT consultant.</h1>
          <p className="font-grotesk text-slate text-base sm:text-lg mt-1">Just drop your requirements.</p>
        </div>
        <SpeechButton onInsert={insertStub} />
      </header>

      {/* THREE COLUMNS */}
      <main className="flex-1 min-h-0 grid grid-cols-1 lg:grid-cols-[320px_1fr_360px] divide-y lg:divide-y-0 lg:divide-x divide-black/10">
        {/* LEFT — gaps */}
        <section className="scroll lg:overflow-y-auto min-h-0 p-5 sm:p-6">
          <Progress covered={coveredCount} total={CHECKS.length} />
          <div className="mt-5 space-y-3">
            {visibleGaps.map(c => (
              <GapCard key={c.key} check={c} onAnswer={answerGap} />
            ))}
            {gaps.length === 0 && (
              <div className="font-grotesk text-sm text-slate border border-dashed border-black/15 rounded-lg p-4">
                Every point is covered. The document is ready to send.
              </div>
            )}
          </div>
          {hiddenCount > 0 && (
            <button onClick={() => setShowAll(true)}
              className="mt-3 font-grotesk text-sm text-sea hover:underline">
              {hiddenCount} more {hiddenCount === 1 ? 'gap' : 'gaps'}
            </button>
          )}
          {showAll && gaps.length > 5 && (
            <button onClick={() => setShowAll(false)} className="mt-3 font-grotesk text-sm text-slate hover:underline">Show fewer</button>
          )}

          {covered.length > 0 && (
            <div className="mt-7">
              <div className="font-grotesk text-[11px] tracking-[0.16em] uppercase text-slate mb-2">Covered</div>
              <ul className="space-y-1.5">
                {covered.map(c => (
                  <li key={c.key} className="flex items-start gap-2.5 py-1">
                    <span className="text-sea mt-[3px]"><Check /></span>
                    <span className="font-grotesk text-[13px] leading-snug">
                      <span className="text-slate">{c.label}: </span>
                      <span className="text-ink">{c.value}</span>
                    </span>
                  </li>
                ))}
              </ul>
            </div>
          )}
        </section>

        {/* CENTER — the document */}
        <section className="scroll lg:overflow-y-auto min-h-0 bg-paper">
          <div className="max-w-[68ch] mx-auto px-6 sm:px-10 py-8">
            <div
              ref={docRef}
              className="doc"
              contentEditable
              suppressContentEditableWarning
              spellCheck={false}
              data-ph="Start talking, or just type. Fragments are fine."
              onInput={scheduleDetect}
            />
          </div>
        </section>

        {/* RIGHT — recorder */}
        <section className="scroll lg:overflow-y-auto min-h-0 p-5 sm:p-6 bg-paper">
          <Recorder />
        </section>
      </main>
    </div>
  );
}

/* progress */
function Progress({ covered, total }){
  const pct = Math.round((covered/total)*100);
  return (
    <div>
      <div className="font-grotesk text-sm text-ink font-500">{covered} of {total} covered</div>
      <div className="mt-2 h-[3px] w-full bg-black/10 rounded-full overflow-hidden">
        <div className="h-full bg-sea rounded-full transition-all duration-500" style={{ width: pct + '%' }} />
      </div>
    </div>
  );
}

/* gap card */
function GapCard({ check, onAnswer }){
  const [val, setVal] = useState('');
  const submit = () => { onAnswer(check.key, val); setVal(''); };
  return (
    <div className="border border-amber/40 bg-amber/5 rounded-lg p-3.5">
      <div className="flex items-center gap-2 mb-2">
        <span className="w-1.5 h-1.5 rounded-full bg-amber" />
        <span className="font-grotesk text-[11px] tracking-[0.14em] uppercase text-amber font-600">{check.label}</span>
      </div>
      <p className="font-grotesk text-[14px] text-ink leading-snug mb-2.5">{check.q}</p>
      <div className="flex gap-2">
        <input
          value={val}
          onChange={e => setVal(e.target.value)}
          onKeyDown={e => { if(e.key === 'Enter') submit(); }}
          placeholder="One line…"
          className="flex-1 min-w-0 font-grotesk text-[13px] bg-paper border border-black/15 rounded-md px-2.5 py-1.5 focus:border-sea"
        />
        <button onClick={submit}
          className="font-grotesk text-[13px] font-600 text-white bg-sea rounded-md px-3 py-1.5 hover:brightness-110 disabled:opacity-40"
          disabled={!val.trim()}>Add</button>
      </div>
    </div>
  );
}

/* speech button — records real audio; transcription is stubbed on stop */
function SpeechButton({ onInsert }){
  const [state, setState] = useState('idle'); // idle | rec | denied | nodev
  const [elapsed, setElapsed] = useState(0);
  const mrRef = useRef(null), streamRef = useRef(null), timerRef = useRef(null);

  const stop = useCallback(() => {
    clearInterval(timerRef.current);
    if(mrRef.current && mrRef.current.state !== 'inactive'){ try{ mrRef.current.stop(); }catch(e){} }
    if(streamRef.current){ streamRef.current.getTracks().forEach(t => t.stop()); streamRef.current = null; }
  }, []);

  useEffect(() => () => stop(), [stop]);

  const start = async () => {
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ setState('nodev'); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
      streamRef.current = stream;
      const mr = new MediaRecorder(stream);
      mrRef.current = mr;
      mr.onstop = () => { onInsert(); };   // STUB: real transcription would go here
      mr.start();
      setElapsed(0); setState('rec');
      timerRef.current = setInterval(() => setElapsed(e => e+1), 1000);
    } catch(err){
      setState(err && err.name === 'NotFoundError' ? 'nodev' : 'denied');
    }
  };

  const toggle = () => { if(state === 'rec'){ stop(); setState('idle'); } else start(); };

  const label = state === 'rec' ? 'Stop' : 'Record';
  return (
    <div className="flex flex-col items-start sm:items-end gap-1">
      <button onClick={toggle}
        className={"font-grotesk font-600 text-white rounded-full px-6 py-3 flex items-center gap-2.5 transition " +
          (state === 'rec' ? 'bg-amber' : 'bg-sea hover:brightness-110')}>
        {state === 'rec' ? <span className="recdot" /> : <Mic size={18} />}
        <span>{label} {state === 'rec' && <span className="tabular-nums font-500 ml-1">{fmt(elapsed)}</span>}</span>
      </button>
      <span className="font-grotesk text-[11px] text-slate">
        {state === 'denied' && 'Microphone blocked — allow access to record.'}
        {state === 'nodev' && 'No microphone found.'}
        {state !== 'denied' && state !== 'nodev' && 'Speak your requirements · transcription stubbed'}
      </span>
    </div>
  );
}

/* right-column camera recorder — real getUserMedia + MediaRecorder + live meter */
function pickMime(){
  const c = ['video/webm;codecs=vp9,opus','video/webm','video/mp4'];
  for(const m of c){ if(window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m; }
  return '';
}
function Recorder(){
  const videoRef = useRef(null), canvasRef = useRef(null);
  const streamRef = useRef(null), mrRef = useRef(null), chunksRef = useRef([]);
  const audioCtxRef = useRef(null), rafRef = useRef(null), timerRef = useRef(null), startTsRef = useRef(0);
  const [status, setStatus] = useState('init'); // init | live | recording | denied | nodev
  const [elapsed, setElapsed] = useState(0);
  const [clips, setClips] = useState([]);
  const clipsRef = useRef([]);
  clipsRef.current = clips;

  const drawMeter = useCallback(() => {
    const canvas = canvasRef.current, ctx = canvas && canvas.getContext('2d');
    const analyser = audioCtxRef.current && audioCtxRef.current._analyser;
    if(!ctx || !analyser){ rafRef.current = requestAnimationFrame(drawMeter); return; }
    const buf = new Uint8Array(analyser.fftSize);
    analyser.getByteTimeDomainData(buf);
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0,0,w,h);
    ctx.fillStyle = '#FBFBF9'; ctx.fillRect(0,0,w,h);
    ctx.lineWidth = 2; ctx.strokeStyle = '#2B4C6F'; ctx.beginPath();
    const slice = w / buf.length;
    for(let i=0;i<buf.length;i++){
      const v = buf[i]/128.0, y = (v*h)/2, x = i*slice;
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.stroke();
    rafRef.current = requestAnimationFrame(drawMeter);
  }, []);

  const initPreview = useCallback(async () => {
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ setStatus('nodev'); return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video:true, audio:true });
      streamRef.current = stream;
      if(videoRef.current){ videoRef.current.srcObject = stream; }
      const AC = window.AudioContext || window.webkitAudioContext;
      const ac = new AC(); audioCtxRef.current = ac;
      const src = ac.createMediaStreamSource(stream);
      const analyser = ac.createAnalyser(); analyser.fftSize = 1024;
      src.connect(analyser); ac._analyser = analyser;
      cancelAnimationFrame(rafRef.current); rafRef.current = requestAnimationFrame(drawMeter);
      setStatus('live');
    } catch(err){
      setStatus(err && err.name === 'NotFoundError' ? 'nodev' : 'denied');
    }
  }, [drawMeter]);

  useEffect(() => {
    initPreview();
    return () => {
      cancelAnimationFrame(rafRef.current);
      clearInterval(timerRef.current);
      if(mrRef.current && mrRef.current.state !== 'inactive'){ try{ mrRef.current.stop(); }catch(e){} }
      if(streamRef.current){ streamRef.current.getTracks().forEach(t => t.stop()); }
      if(audioCtxRef.current){ try{ audioCtxRef.current.close(); }catch(e){} }
      clipsRef.current.forEach(c => URL.revokeObjectURL(c.url));
    };
  }, [initPreview]);

  const startRec = () => {
    if(!streamRef.current || status !== 'live') return;
    const mime = pickMime();
    let mr;
    try { mr = new MediaRecorder(streamRef.current, mime ? { mimeType:mime } : undefined); }
    catch(e){ mr = new MediaRecorder(streamRef.current); }
    mrRef.current = mr; chunksRef.current = [];
    mr.ondataavailable = e => { if(e.data && e.data.size) chunksRef.current.push(e.data); };
    mr.onstop = () => {
      const blob = new Blob(chunksRef.current, { type: mime || 'video/webm' });
      const url = URL.createObjectURL(blob);
      const dur = Math.round((Date.now() - startTsRef.current)/1000);
      setClips(cs => [{ id: Date.now(), url, dur, size: blob.size }, ...cs]);
    };
    mr.start();
    startTsRef.current = Date.now(); setElapsed(0); setStatus('recording');
    timerRef.current = setInterval(() => setElapsed(e => e+1), 1000);
  };
  const stopRec = () => {
    clearInterval(timerRef.current);
    if(mrRef.current && mrRef.current.state !== 'inactive'){ try{ mrRef.current.stop(); }catch(e){} }
    setStatus('live');
  };
  const removeClip = (id) => {
    setClips(cs => { const c = cs.find(x => x.id === id); if(c) URL.revokeObjectURL(c.url); return cs.filter(x => x.id !== id); });
  };

  return (
    <div>
      <div className="font-grotesk text-[11px] tracking-[0.16em] uppercase text-slate mb-3">Record a brief</div>

      <div className="rounded-lg overflow-hidden border border-black/10 bg-ink/95 aspect-video relative">
        {(status === 'denied' || status === 'nodev' || status === 'init') && (
          <div className="absolute inset-0 flex flex-col items-center justify-center text-center px-5 gap-2">
            <span className="text-paper/90"><Mic size={22} /></span>
            <p className="font-grotesk text-[13px] text-paper/85 leading-snug">
              {status === 'denied' && 'Camera or microphone was blocked. Allow access, then try again.'}
              {status === 'nodev' && 'No camera or microphone was found on this device.'}
              {status === 'init' && 'Requesting camera…'}
            </p>
            {(status === 'denied' || status === 'nodev') && (
              <button onClick={initPreview} className="mt-1 font-grotesk text-[13px] font-600 text-ink bg-paper rounded-md px-3 py-1.5">Try again</button>
            )}
          </div>
        )}
        <video ref={videoRef} muted autoPlay playsInline
          className="w-full h-full object-cover"
          style={{ transform:'scaleX(-1)', visibility: (status==='live'||status==='recording') ? 'visible':'hidden' }} />
        {status === 'recording' && (
          <div className="absolute top-2 left-2 flex items-center gap-1.5 bg-black/45 rounded-full px-2.5 py-1">
            <span className="recdot" /><span className="font-grotesk text-[12px] text-paper tabular-nums">{fmt(elapsed)}</span>
          </div>
        )}
      </div>

      <canvas ref={canvasRef} width="360" height="52" className="meter mt-3 rounded border border-black/10" />

      <div className="mt-3 flex gap-2">
        {status !== 'recording'
          ? <button onClick={startRec} disabled={status !== 'live'}
              className="font-grotesk text-sm font-600 text-white bg-sea rounded-md px-4 py-2 hover:brightness-110 disabled:opacity-40">Start recording</button>
          : <button onClick={stopRec}
              className="font-grotesk text-sm font-600 text-white bg-amber rounded-md px-4 py-2">Stop</button>}
      </div>

      <div className="mt-5">
        <div className="font-grotesk text-[11px] tracking-[0.16em] uppercase text-slate mb-2">Clips</div>
        {clips.length === 0 && <p className="font-grotesk text-[13px] text-slate">No clips yet. Record one to review it here.</p>}
        <ul className="space-y-3">
          {clips.map(c => (
            <li key={c.id} className="border border-black/10 rounded-lg p-2.5">
              <video src={c.url} controls className="w-full rounded" />
              <div className="mt-2 flex items-center justify-between font-grotesk text-[12px] text-slate">
                <span>{fmt(c.dur)} · {(c.size/1048576).toFixed(1)} MB</span>
                <span className="flex gap-3">
                  <a href={c.url} download={"brief-"+c.id+".webm"} className="text-sea hover:underline">Download</a>
                  <button onClick={() => removeClip(c.id)} className="text-amber hover:underline">Delete</button>
                </span>
              </div>
            </li>
          ))}
        </ul>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
